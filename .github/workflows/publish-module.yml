name: Publish module

# Pushing a tag like ticktracker-4.0.1 or damagecounter-1.0.0 that points at this branch
# checks the package against its recorded SHA-256 and attaches it to that tag's release
# (creating the release if it isn't there yet).
on:
  push:
    tags: ['ticktracker-*', 'damagecounter-*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    - name: Work out the package name from the tag
      run: |
        case "$GITHUB_REF_NAME" in
          ticktracker-*)   echo "PACKAGE=TickTracker-${GITHUB_REF_NAME#ticktracker-}.zip" >> "$GITHUB_ENV"
                           echo "TITLE=TickTracker ${GITHUB_REF_NAME#ticktracker-} (module package)" >> "$GITHUB_ENV" ;;
          damagecounter-*) echo "PACKAGE=DamageCounter-${GITHUB_REF_NAME#damagecounter-}.zip" >> "$GITHUB_ENV"
                           echo "TITLE=Damage Counter ${GITHUB_REF_NAME#damagecounter-} (module package)" >> "$GITHUB_ENV" ;;
          *) echo "Unknown module tag $GITHUB_REF_NAME"; exit 1 ;;
        esac

    - name: Check the package against its recorded SHA-256
      run: |
        grep -q "  ${PACKAGE}\$" checksums.txt
        sha256sum -c checksums.txt

    # Kept as a pre-release so it never counts as the launcher's "latest release"
    - name: Attach the package to the release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.PACKAGE }}
        name: ${{ env.TITLE }}
        body_path: RELEASE-NOTES.md
        prerelease: true
        fail_on_unmatched_files: true
