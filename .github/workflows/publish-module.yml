name: Publish module

# A release is created by hand on GitHub with a tag like ticktracker-4.0.1 pointing at this branch.
# This then checks the package and attaches it to that release.
on:
  push:
    tags: ['ticktracker-*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    - name: Work out the package name from the tag
      run: echo "PACKAGE=TickTracker-${GITHUB_REF_NAME#ticktracker-}.zip" >> "$GITHUB_ENV"

    - name: Check the package against its recorded SHA-256
      run: |
        grep -q "  ${PACKAGE}\$" checksums.txt
        sha256sum -c checksums.txt

    # Kept as a pre-release so it never counts as the launcher's "latest release"
    - name: Attach the package to the release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.PACKAGE }}
        prerelease: true
        fail_on_unmatched_files: true
